[package]
name = "Bookmark-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "2"
dotenvy = "0.15"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors", "set-header"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.16", features = ["derive"] }
jsonwebtoken = "9"
futures = "0.3.32"
scraper = "0.25.0"
tower_governor = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
time = "0.3"
